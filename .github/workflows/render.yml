name: Render snippet

# Renders one snippet and sends the PNG to Telegram.
#
# Triggered by the Cloudflare Worker via repository_dispatch when a message or a
# button tap arrives, and by hand for self-tests.
#
# Two jobs because the platforms cannot share a runner: Compose renders on the
# JVM through LayoutLib and runs on free Linux, while SwiftUI has no Linux
# implementation and needs macOS. Each job gates on `platform`, so one runs.
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      snippet_id: { required: true,  description: 'basename under snippets/ (self-test only)' }
      platform:   { required: true,  description: 'android | ios' }
      theme:      { required: false, default: 'dark' }
      device:     { required: false, default: 'phone' }
      chat_id:    { required: false, default: '0' }
      message_id: { required: false, default: '' }

concurrency:
  # platform is in the key. Without it, the iOS render of a snippet cancels the
  # Android render of the same snippet — which happened here on day one, and in
  # both harness repos before that.
  group: >-
    render-${{ github.event.client_payload.platform   || inputs.platform }}-${{
                github.event.client_payload.snippet_id || inputs.snippet_id }}-${{
                github.event.client_payload.theme      || inputs.theme }}-${{
                github.event.client_payload.device     || inputs.device }}
  cancel-in-progress: true

env:
  PLATFORM:   ${{ github.event.client_payload.platform   || inputs.platform }}
  THEME:      ${{ github.event.client_payload.theme      || inputs.theme    || 'dark' }}
  DEVICE:     ${{ github.event.client_payload.device     || inputs.device   || 'phone' }}
  SNIPPET_ID: ${{ github.event.client_payload.snippet_id || inputs.snippet_id }}
  # A self-test dispatched by hand has no chat to answer, so it falls back to
  # the allowlisted one. Without this the render succeeds and the send dies with
  # "chat not found", which is a confusing way to report a working renderer.
  CHAT: >-
    ${{ github.event.client_payload.chat_id
        || (inputs.chat_id != '0' && inputs.chat_id)
        || secrets.TELEGRAM_CHAT_ID }}
  MSG:        ${{ github.event.client_payload.message_id || inputs.message_id }}
  # The snippet is arbitrary user-supplied source. It reaches the runner ONLY as
  # an environment variable and is written out with printf. Interpolating it
  # into a `run:` block with ${{ }} would let anyone who can message the bot run
  # commands on the runner — the code is pasted verbatim into the script before
  # bash ever sees it, so quoting cannot save you.
  CODE:       ${{ github.event.client_payload.code }}
  ZIP_B64:    ${{ github.event.client_payload.zip_b64 }}
  CLICKS:     ${{ github.event.client_payload.clicks }}

jobs:
  android:
    if: (github.event.client_payload.platform || inputs.platform) == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - name: Place the snippet
        run: |
          set -euo pipefail
          SRC=/tmp/src
          mkdir -p "$SRC"
          if [ -n "${ZIP_B64:-}" ]; then
            printf '%s' "$ZIP_B64" | base64 -d > /tmp/bundle.zip
            unzip -qo /tmp/bundle.zip -d "$SRC"
            echo "unpacked $(find "$SRC" -name '*.kt' | wc -l) .kt file(s)"
          elif [ -n "${CODE:-}" ]; then
            printf '%s\n' "$CODE" > "$SRC/Snippet.kt"
          else
            cp "snippets/${SNIPPET_ID}.kt" "$SRC/Snippet.kt"
          fi
          # Finds the entry point rather than demanding one, so a real file with
          # its own package line and several composables works unchanged, and a
          # zip of several files renders the ROOT view rather than a leaf.
          rm -f android-preview/src/test/kotlin/Snippet.kt
          python3 scripts/prepare.py "$SRC" android-preview/src/test/kotlin android

      - name: Render with Paparazzi
        id: render
        working-directory: android-preview
        env:
          PREVIEW_THEME:  ${{ env.THEME }}
          PREVIEW_DEVICE: ${{ env.DEVICE }}
          PREVIEW_CLICKS: ${{ env.CLICKS }}
        run: |
          # set +e so a Kotlin error in someone's snippet is reported back to
          # them rather than ending the job with an opaque red X.
          set +e
          gradle testDebugUnitTest --no-daemon > render.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          grep -E '^e: |error:' render.log | head -20


      - name: Keep the render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # An artifact, never the job log: this repo is public and a compiler
          # error quotes the sender's source. Artifacts need auth to download.
          name: render-log-${{ github.run_id }}-android
          path: |
            android-preview/render.log
            android-preview/build/buttons.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Send result
        if: always()
        run: bash scripts/send.sh android-preview "${{ steps.render.outputs.rc }}"

  ios:
    if: (github.event.client_payload.platform || inputs.platform) == 'ios'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Place the snippet
        run: |
          set -euo pipefail
          SRC=/tmp/src
          mkdir -p "$SRC"
          if [ -n "${ZIP_B64:-}" ]; then
            printf '%s' "$ZIP_B64" | base64 -d > /tmp/bundle.zip
            unzip -qo /tmp/bundle.zip -d "$SRC"
            echo "unpacked $(find "$SRC" -name '*.swift' | wc -l) .swift file(s)"
          elif [ -n "${CODE:-}" ]; then
            printf '%s\n' "$CODE" > "$SRC/Snippet.swift"
          else
            cp "snippets/${SNIPPET_ID}.swift" "$SRC/Snippet.swift"
          fi
          python3 scripts/prepare.py "$SRC" ios-preview/sources ios

      - name: Build swiftui-render
        run: |
          set +e
          git clone --depth 1 https://github.com/olliewagner/swiftui-render.git /tmp/sr
          cd /tmp/sr && swift build -c release > /tmp/sr-build.log 2>&1
          echo "swiftui-render build rc=$?"
          tail -5 /tmp/sr-build.log

      - name: Render
        id: render
        env:
          PREVIEW_THEME:  ${{ env.THEME }}
          PREVIEW_DEVICE: ${{ env.DEVICE }}
        run: |
          set +e
          bash ios-preview/render.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"


      - name: Keep the render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # An artifact, never the job log: this repo is public and a compiler
          # error quotes the sender's source. Artifacts need auth to download.
          name: render-log-${{ github.run_id }}-ios
          path: |
            ios-preview/render.log
            /tmp/sr-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Send result
        if: always()
        run: bash scripts/send.sh ios-preview "${{ steps.render.outputs.rc }}"
